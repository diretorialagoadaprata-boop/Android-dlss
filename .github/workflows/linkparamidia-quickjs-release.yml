name: LinkParaMidia Android 1.4 QuickJS EJS integration
on:
  push:
    branches: [linkparamidia-youtube-js-runtime-20261026]
    paths: ['linkparamidia/**', '.github/workflows/linkparamidia-quickjs-release.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install FFmpeg for real media tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Test times, quality, conversion and clips
        run: bash linkparamidia/tests/run.sh
      - name: Generate release signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lpm"
          pw="$(openssl rand -hex 24)"
          echo "::add-mask::$pw"
          echo "LPM_STORE_PASSWORD=$pw" >> "$GITHUB_ENV"
          echo "LPM_KEY_PASSWORD=$pw" >> "$GITHUB_ENV"
          echo "LPM_KEY_ALIAS=linkparamidia" >> "$GITHUB_ENV"
          echo "LPM_KEYSTORE_PATH=$RUNNER_TEMP/lpm/release.jks" >> "$GITHUB_ENV"
          keytool -genkeypair -keystore "$RUNNER_TEMP/lpm/release.jks" -alias linkparamidia -keyalg RSA -keysize 3072 -validity 3650 -storepass "$pw" -keypass "$pw" -dname 'CN=Link para Midia, OU=Android, O=Link para Midia, C=BR' -noprompt
      - name: Compile Android QuickJS-NG executable and package as native library
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'ndk;27.2.12479018'
          git clone --depth 1 --branch v0.17.0 https://github.com/quickjs-ng/quickjs.git /tmp/quickjs-ng
          cmake -S /tmp/quickjs-ng -B /tmp/quickjs-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXE_LINKER_FLAGS="-Wl,-z,max-page-size=16384"
          cmake --build /tmp/quickjs-build --target qjs -j 2
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" /tmp/quickjs-build/qjs
          mkdir -p linkparamidia/app/src/main/jniLibs/arm64-v8a
          install -m755 /tmp/quickjs-build/qjs linkparamidia/app/src/main/jniLibs/arm64-v8a/libqjs.so
          file linkparamidia/app/src/main/jniLibs/arm64-v8a/libqjs.so
      - name: Assemble genuine release APK
        run: gradle --no-daemon -p linkparamidia :app:assembleRelease --stacktrace
      - name: Inspect signature and manifest
        shell: bash
        run: |
          set -euo pipefail
          APK=linkparamidia/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep "package: name='br.com.linkparamidia.media2026js'" "$RUNNER_TEMP/badging.txt"
          grep "launchable-activity: name='br.com.linkparamidia.MainActivity'" "$RUNNER_TEMP/badging.txt"
          if grep -q application-debuggable "$RUNNER_TEMP/badging.txt"; then exit 1; fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/sig.txt"
          grep "Verified using v2 scheme.*true" "$RUNNER_TEMP/sig.txt"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$APK"
          unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/libffmpeg.so'
          unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/libqjs.so'
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: LinkParaMidia-Android-1.4-Release
          path: linkparamidia/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [google_apis, google_apis_ps16k]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LinkParaMidia-Android-1.4-Release
          path: apk
      - uses: android-actions/setup-android@v4
      - name: KVM
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Install exact RELEASE APK and launch on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: ${{ matrix.target }}
          emulator-boot-timeout: 650
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 2048 -cores 2
          script: |
            adb shell getprop ro.build.version.release
            adb shell getconf PAGE_SIZE
            adb install -r apk/app-release.apk
            adb shell pm path br.com.linkparamidia.media2026js
            adb shell am start -n br.com.linkparamidia.media2026js/br.com.linkparamidia.MainActivity
            sleep 5
            adb shell pidof br.com.linkparamidia.media2026js
            adb logcat -d -s LPM_ENGINE:I LPM_ENGINE:E | tee /tmp/lpm-js.txt
            grep 'QJS_OK' /tmp/lpm-js.txt
            adb logcat -d -s AndroidRuntime:E | tail -20

  publish:
    needs: [build, emulator]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LinkParaMidia-Android-1.4-Release
          path: apk
      - name: Publish direct APK (only if emulators passed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp apk/app-release.apk LinkParaMidia_Android_1.4_ARM64_RELEASE.apk
          gh release create linkparamidia-android-v1.4-quickjs LinkParaMidia_Android_1.4_ARM64_RELEASE.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Link para Midia Android 1.4 - QuickJS + EJS" --notes "APK release ARM64 nao depuravel, compilado com QuickJS-NG e integracao yt-dlp EJS (componentes oficiais atualizaveis); emuladores Android 16 verificados. Bloqueios de autenticacao do YouTube ainda podem impedir downloads; nao homologado com a conta ou telefone fisico." --prerelease
