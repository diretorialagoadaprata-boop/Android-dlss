name: Android DLSS Host (Wine/Box64)

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "host/**"
      - "bridge/**"
      - ".github/workflows/winlator-host-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout host project
        uses: actions/checkout@v4

      - name: Checkout upstream Winlator
        uses: actions/checkout@v4
        with:
          repository: brunodev85/winlator-app
          ref: main
          path: winlator
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android/NDK toolchain
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Build open-source Windows frame presenter
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-mingw-w64-x86-64
          x86_64-w64-mingw32-g++ \
            -std=c++17 -O2 -municode -mwindows \
            bridge/windows/AndroidFramePresenter.cpp \
            -o bridge/AndroidFramePresenter.exe \
            -ld3d11 -ldxgi -ld3dcompiler -lshell32 \
            -static -static-libgcc -static-libstdc++
          test -s bridge/AndroidFramePresenter.exe
          file bridge/AndroidFramePresenter.exe | tee bridge-presenter-file.txt
          grep -q "PE32+ executable" bridge-presenter-file.txt
          sha256sum bridge/AndroidFramePresenter.exe | tee AndroidFramePresenter.sha256

      - name: Apply Android DLSS Host patch
        run: python3 host/patch_winlator.py

      - name: Verify no proprietary DLSS package is bundled
        shell: bash
        run: |
          set -euo pipefail
          ! find winlator -type f \( -iname 'nvngx_dlssnr.dll' -o -iname 'nvngx_dlss.dll' -o -iname 'DLSS5ForAll.exe' -o -iname 'renodx-dlss5.addon64' -o -iname 'dlss5-feed.addon64' \) | grep .
          test -s winlator/app/src/main/assets/android-frame-presenter.exe

      - name: Build ARM64 debug APK
        working-directory: winlator
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Sign APK with stable development key
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          INPUT="winlator/app/build/outputs/apk/debug/app-debug.apk"
          ALIGNED="winlator/app/build/outputs/apk/debug/app-aligned.apk"
          OUTPUT="winlator/app/build/outputs/apk/debug/Android-DLSS-Host-0.2.2-compat.apk"
          base64 -d host/android-dlss-dev-keystore.b64 > /tmp/android-dlss-dev.p12
          "$BUILD_TOOLS/zipalign" -f -p 4 "$INPUT" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/android-dlss-dev.p12 \
            --ks-type PKCS12 \
            --ks-key-alias androiddlss \
            --ks-pass pass:androiddlss \
            --key-pass pass:androiddlss \
            --out "$OUTPUT" \
            "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$OUTPUT" | tee apk-signature.txt
          rm -f /tmp/android-dlss-dev.p12

      - name: Verify APK and bridge payload
        shell: bash
        run: |
          set -euo pipefail
          APK="winlator/app/build/outputs/apk/debug/Android-DLSS-Host-0.2.2-compat.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | tee apk-files.txt
          grep -q "assets/android-frame-presenter.exe" apk-files.txt
          sha256sum "$APK" | tee Android-DLSS-Host.sha256
          ls -lh "$APK" bridge/AndroidFramePresenter.exe

      - name: Explain runtime validation boundary
        shell: bash
        run: |
          cat <<'EOF'
          Build-time validation passed.
          The Winlator runtime is ARM64/Box64-oriented, so an x86_64 Android emulator is not
          a valid end-to-end runtime test. Real runtime validation must be performed on an
          ARM64 Android device. This build uses a stable development signing key so future
          test APKs can update it in place after this signing transition.
          EOF

      - name: Upload Android DLSS Host APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-DLSS-Host-0.2.2-compat-ARM64
          path: |
            winlator/app/build/outputs/apk/debug/Android-DLSS-Host-0.2.2-compat.apk
            Android-DLSS-Host.sha256
            AndroidFramePresenter.sha256
            apk-signature.txt
          if-no-files-found: error
          retention-days: 14
