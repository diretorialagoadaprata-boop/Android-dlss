name: Android DLSS Host (Wine/Box64)

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "host/**"
      - ".github/workflows/winlator-host-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout host project
        uses: actions/checkout@v4

      - name: Checkout upstream Winlator
        uses: actions/checkout@v4
        with:
          repository: brunodev85/winlator-app
          ref: main
          path: winlator
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android/NDK toolchain
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Apply Android DLSS Host patch
        run: python3 host/patch_winlator.py

      - name: Verify no proprietary DLSS package is bundled
        shell: bash
        run: |
          set -euo pipefail
          ! find winlator -type f \( -iname 'nvngx_dlssnr.dll' -o -iname 'nvngx_dlss.dll' -o -iname 'DLSS5ForAll.exe' \) | grep .

      - name: Build ARM64 debug APK
        working-directory: winlator
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Verify APK archive
        shell: bash
        run: |
          set -euo pipefail
          APK="winlator/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK" | tee Android-DLSS-Host.sha256
          ls -lh "$APK"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Install and boot-test host on Android 15
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -euo pipefail
            APK="winlator/app/build/outputs/apk/debug/app-debug.apk"
            PKG="com.lm.androiddlsshost"
            ACT="$PKG/com.winlator.DlssHostActivity"
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop "$PKG" || true
            adb shell am start -W -n "$ACT"
            for i in $(seq 1 90); do
              adb shell pidof "$PKG" >/dev/null
              adb shell uiautomator dump /sdcard/host.xml >/dev/null 2>&1 || true
              adb shell cat /sdcard/host.xml > host-ui.xml 2>/dev/null || true
              if grep -q "Runtime pronto" host-ui.xml; then
                echo "Host runtime/container reached ready state"
                break
              fi
              if [ "$i" -eq 90 ]; then
                echo "Host did not reach runtime-ready state in time"
                adb logcat -d | tail -500
                cat host-ui.xml || true
                exit 1
              fi
              sleep 2
            done
            if adb logcat -d | grep -E "FATAL EXCEPTION|UnsatisfiedLinkError" | grep -q "$PKG\|com.winlator"; then
              adb logcat -d | tail -500
              exit 1
            fi
            adb shell pidof "$PKG"

      - name: Upload Android DLSS Host APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-DLSS-Host-ARM64
          path: |
            winlator/app/build/outputs/apk/debug/app-debug.apk
            Android-DLSS-Host.sha256
          if-no-files-found: error
          retention-days: 14
