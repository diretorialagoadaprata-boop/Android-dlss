name: Android build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          cat bootstrap/source.b64.part00 bootstrap/source.b64.part01 bootstrap/source.b64.part02 bootstrap/source.b64.part03a bootstrap/source.b64.part03b bootstrap/source.b64.part04 | base64 -d > work/source.zip
          echo "23fa5a0bb1c1a13b8aa924dbdd0c55e7543d5d178d1d5b2af36ae0a19fe6499f  work/source.zip" | sha256sum -c -
          unzip -t work/source.zip
          mkdir -p work/project
          unzip -q work/source.zip -d work/project
          test -f work/project/settings.gradle.kts
          test -f work/project/app/build.gradle.kts

      - name: Apply Android renderer compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          FILE="work/project/app/src/main/java/com/lm/neuralframe/ProjectionRenderer.java"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("work/project/app/src/main/java/com/lm/neuralframe/ProjectionRenderer.java")
          s = p.read_text()
          old = "public void onSurfaceCreated(javax.microedition.khronos.egl.EGLConfig config)"
          new = "public void onSurfaceCreated(javax.microedition.khronos.opengles.GL10 gl, javax.microedition.khronos.egl.EGLConfig config)"
          if old in s:
              s = s.replace(old, new)
              p.write_text(s)
          if new not in p.read_text():
              raise SystemExit("renderer patch did not apply")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Python test dependencies
        run: python3 -m pip install --user numpy

      - name: Run optical-flow reference tests
        working-directory: work/project
        run: python3 tools/flow_reference_test.py

      - name: Compile debug APK
        working-directory: work/project
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="work/project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK" | tee app-debug.sha256
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-dlss-debug-apk
          path: |
            work/project/app/build/outputs/apk/debug/app-debug.apk
            app-debug.sha256
          if-no-files-found: error
          retention-days: 14
