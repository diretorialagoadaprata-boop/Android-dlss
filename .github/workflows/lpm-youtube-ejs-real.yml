name: Link para Midia - real YouTube with official JS runtime
on:
  push:
    branches: [linkparamidia-test-real-media-20261026]
    paths: ['.github/workflows/lpm-youtube-ejs-real.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-js-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install latest official yt-dlp ejs
        run: |
          python -m pip install -U 'yt-dlp[default]'
          deno --version
      - name: Public YouTube metadata with Deno and EJS (non-fatal access check)
        shell: bash
        run: |
          set +e
          for id in jNQXAC9IVRw u2ah9tWTkmk; do
            echo "VIDEO_ID=$id"
            timeout 75 python -m yt_dlp --no-playlist --no-warnings --remote-components ejs:github --skip-download --print '%(id)s %(title)s' "https://www.youtube.com/watch?v=$id" > "/tmp/$id.log" 2>&1
            echo "EXTRACTION_EXIT=$?"
            tail -15 "/tmp/$id.log"
          done
          exit 0
