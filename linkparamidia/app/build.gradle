plugins { id 'com.android.application' }

android {
    namespace 'br.com.linkparamidia'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.linkparamidia.media2026'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.3.0'
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        production {
            storeFile file(System.getenv('LPM_KEYSTORE_PATH') ?: '/tmp/missing-lpm-signing-key.jks')
            storePassword System.getenv('LPM_STORE_PASSWORD') ?: ''
            keyAlias System.getenv('LPM_KEY_ALIAS') ?: 'linkparamidia'
            keyPassword System.getenv('LPM_KEY_PASSWORD') ?: ''
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            signingConfig signingConfigs.production
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs { useLegacyPackaging true }
    }
}

dependencies {
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
}
