plugins { id 'com.android.application' }

android {
    namespace 'br.com.linkparamidia'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.linkparamidia.newpipe2026'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '1.6.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        production {
            storeFile file(System.getenv('LPM_KEYSTORE_PATH') ?: '/tmp/missing-lpm-signing-key.jks')
            storePassword System.getenv('LPM_STORE_PASSWORD') ?: ''
            keyAlias System.getenv('LPM_KEY_ALIAS') ?: 'linkparamidia'
            keyPassword System.getenv('LPM_KEY_PASSWORD') ?: ''
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            signingConfig signingConfigs.production
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs { useLegacyPackaging true }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
}
